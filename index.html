<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mehedy Telecom</title>
    <meta name="description" content="A complete shop management system for Mehedy Telecom with inventory tracking, sales reporting, and Telegram-based image storage." />
    <meta property="og:title" content="Mehedy Telecom" />
    <meta property="og:description" content="A complete shop management system for Mehedy Telecom with inventory tracking, sales reporting, and Telegram-based image storage." />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
